<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>會員註冊</title>
    <style>
        body {
            margin: 0;
            min-height: 100vh;
            font-family: Arial, "Noto Sans TC", sans-serif;
            background: #f4f6f8;
            display: grid;
            place-items: center;
            color: #1f2933;
        }

        main {
            width: min(420px, calc(100vw - 32px));
            margin: 24px 0;
            background: #ffffff;
            border: 1px solid #d9e2ec;
            border-radius: 8px;
            padding: 32px;
            box-sizing: border-box;
        }

        h1 { margin: 0 0 24px; font-size: 28px; }
        label { display: block; margin: 16px 0 8px; font-weight: 700; }
        input, select {
            width: 100%;
            box-sizing: border-box;
            padding: 12px;
            border: 1px solid #bcccdc;
            border-radius: 6px;
            font-size: 16px;
        }
        button {
            width: 100%;
            margin-top: 24px;
            padding: 12px 16px;
            border: 0;
            border-radius: 6px;
            background: #1769aa;
            color: #ffffff;
            font-size: 16px;
            font-weight: 700;
            cursor: pointer;
        }
        .message, .error {
            display: none;
            margin: 0 0 16px;
            padding: 12px;
            border-radius: 6px;
        }
        .message { background: #e3f8ee; color: #0b6b3a; }
        .error { background: #ffe3e3; color: #9b1c1c; white-space: pre-line; }
        .link-row { margin-top: 16px; text-align: center; }
        a { color: #1769aa; font-weight: 700; text-decoration: none; }
        a:hover { text-decoration: underline; }
    </style>
</head>
<body>
<main>
    <h1>會員註冊</h1>
    <p id="message" class="message"></p>
    <p id="error" class="error"></p>

    <form id="registerForm">
        <label for="name">姓名</label>
        <input id="name" name="name" type="text" maxlength="30" required>

        <label for="gender">性別</label>
        <select id="gender" name="gender" required>
            <option value="">請選擇</option>
            <option value="0">不透露</option>
            <option value="1">男性</option>
            <option value="2">女性</option>
        </select>

        <label for="account">帳號</label>
        <input id="account" name="account" type="text" maxlength="30" required>

        <label for="email">Email（選填）</label>
        <input id="email" name="email" type="email" maxlength="128">

        <label for="password">密碼（6～12 字元）</label>
        <input id="password" name="password" type="password" minlength="6" maxlength="12" required>

        <label for="confirmPassword">確認密碼</label>
        <input id="confirmPassword" name="confirmPassword" type="password" required>

        <button id="registerButton" type="submit">註冊</button>
    </form>
    <div class="link-row">
        <a href="/page/login">已有帳號？前往登入</a>
    </div>
</main>

<script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
<script>
    $("#registerForm").on("submit", function (event) {
        event.preventDefault();
        $("#message, #error").hide();

        const payload = {
            name: $("#name").val().trim(),
            gender: Number($("#gender").val()),
            account: $("#account").val().trim(),
            email: $("#email").val().trim() || null,
            password: $("#password").val(),
            confirmPassword: $("#confirmPassword").val()
        };

        $("#registerButton").prop("disabled", true).text("註冊中");

        $.ajax({
            url: "/members/register",
            method: "POST",
            contentType: "application/json",
            data: JSON.stringify(payload),
            success: function (data) {
                $("#message").text(data.message || "註冊成功，請登入。").show();
                $("#registerForm")[0].reset();
                setTimeout(function () {
                    window.location.href = "/page/login";
                }, 1000);
            },
            error: function (xhr) {
                const data = xhr.responseJSON || {};
                const fieldErrors = Object.values(data.errors || {});
                const message = fieldErrors.length > 0
                    ? fieldErrors.join("\n")
                    : (data.message || "註冊失敗，請稍後再試。");
                $("#error").text(message).show();
            },
            complete: function () {
                $("#registerButton").prop("disabled", false).text("註冊");
            }
        });
    });
</script>
</body>
</html>
